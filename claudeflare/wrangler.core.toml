# #259 OS3a: billing-free Worker core entry. Second deploy config beside the
# full build (wrangler.toml); source of the Worker part shipped as OSS.
#
# #264 OS4b: final shape without hosted machinery (fixed in this file).
#   no daily cron / KV as commented example / no node-compat flag / no vars block /
#   no prod KV id — the full build (wrangler.toml) holds all of them.
#
# Only OPENROUTER_API_KEY is needed (ASK_TOKEN optional).

name = "umeboshi-ask-core"
main = "src/core.ts"
compatibility_date = "2024-09-23"

# No crons. The full daily cron owns both model-inventory refresh and Stripe
# checks (#115 / spec #110 decision 7). Core runs on the fixed 5-model bundle.
#
# No nodejs_compat. The full build needs it to resolve the Stripe SDK (stripe-node)
# Node assumptions; core ships no billing so it never imports stripe
# (never loads billing, billing-view, reconcile, settle, usage, anon).
#
# Auth is a single access token. No login-auth path (external IdP, signed
# tokens, 20-char codes) (#262 OS4a: full wrangler.toml side owns it).
#   npx wrangler secret put OPENROUTER_API_KEY        # keep out of public repo/logs
#   npx wrangler secret put ASK_TOKEN                 # optional. Only when saving.
#
# KV is optional for storage (threads, settings, panel lookup). Without a binding,
# chat/models run and storage routes 500 while the panel falls back to local settings
# (#259 OS3a degraded contract). Only self-hosts that bind KV create one:
#   npx wrangler kv namespace create UMEBOSHI_KV
# [[kv_namespaces]]
# binding = "UMEBOSHI_KV"
# id = "00000000000000000000000000000000"
#
# Try locally (no KV):
#   cd claudeflare && npx wrangler dev --config wrangler.core.toml
