name: release-vessel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  vessel:
    runs-on: ubuntu-latest
    steps:
      - name: Create empty release vessel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes "Release vessel for $TAG. Changelog to be added."
